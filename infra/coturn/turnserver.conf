# coturn para a voz do Vekrom (WebRTC atrás de NAT/4G).
# Instalado e DESLIGADO por padrão. Para ligar, veja "TURN (voz)" no README.
# Credenciais temporárias: a API gera usuário/senha com HMAC deste segredo (TURN_SECRET no .env),
# válidos por 6h. Ninguém precisa de senha fixa.
listening-port=3478
listening-ip=10.0.0.40
relay-ip=10.0.0.40
external-ip=144.33.6.56/10.0.0.40
min-port=49160
max-port=49200
realm=vekrom
use-auth-secret
static-auth-secret=__TROCAR_PELO_TURN_SECRET__
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Ninguém usa o TURN para alcançar a rede interna da VM (SSRF).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
user-quota=12
total-quota=120
max-bps=1500000
stale-nonce=600
syslog
simple-log

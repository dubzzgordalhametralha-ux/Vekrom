# Postgres 16 numa VM de 1 GB (com API, gateway, Redis e Caddy dividindo a RAM).
# Copiar para /etc/postgresql/16/main/conf.d/ e: sudo systemctl restart postgresql
shared_buffers = 96MB
effective_cache_size = 320MB
work_mem = 2MB
maintenance_work_mem = 32MB
max_connections = 30          # API usa PGPOOL_MAX=5, gateway 2, migrate/backup 1
wal_buffers = 4MB
min_wal_size = 64MB
max_wal_size = 256MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1        # disco em bloco (SSD)
autovacuum_max_workers = 2
jit = off                     # JIT custa RAM e não ajuda em consultas curtas
